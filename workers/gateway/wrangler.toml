#:schema node_modules/wrangler/config-schema.json
name = "m2m-gateway"
main = "src/index.ts"
compatibility_date = "2026-08-11"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# Consolidated under the code402.dev zone (same CF account).
routes = [
  { pattern = "gateway.code402.dev", custom_domain = true },
]

# Alternative public face on the codex402.dev zone. PENDING: zone must be
# active in the Cloudflare account (nameservers switched at Namecheap) before
# this route can attach — add and `wrangler deploy` once it is.
# routes = [
#   { pattern = "codex402.dev", custom_domain = true },
# ]

# Local secrets go in .dev.vars (gitignored) — see ../../.dev.vars.example.
# SELLER_WALLET_ADDRESS=0x...

# Deployed (production-on-testnet) config. The seller wallet is a public
# receiving address, not a secret, so it lives here as a plain var.
# JUANA LIMITED operating/receiving wallet (EIP-55 checksummed).
[vars]
SELLER_WALLET_ADDRESS = "0x417Da74CDc0D3BabF6AdC851b6E5c638574c0D58"

[[d1_databases]]
binding = "REGISTRY"
database_name = "m2m-registry"
database_id = "0014229c-50db-442a-86ec-ab29f978299d"
migrations_dir = "migrations"
