#:schema node_modules/wrangler/config-schema.json
name = "code402-facilitator"
main = "src/index.ts"
compatibility_date = "2026-08-11"
compatibility_flags = ["nodejs_compat"]

# Self-hosted x402 facilitator: verify + settle on behalf of the estate gateway.
# The relayer key pays gas only — USDC moves buyer→seller directly via
# EIP-3009 transferWithAuthorization. Funds never touch the relayer's balance.
# Secrets (wrangler secret put):
#   RELAYER_PRIVATE_KEY  EOA that pays gas (holds ETH on the target network)
#   FACILITATOR_KEY      shared secret the gateway must send as X-FACILITATOR-KEY
#                        (required when set; leave unset only for dev)
routes = [
  { pattern = "facilitator.code402.dev", custom_domain = true },
]

[vars]
# "base-sepolia" (default) or "base" (mainnet). Flip together with the gateway.
NETWORK = "base-sepolia"
# Optional RPC overrides (defaults: public Base endpoints).
# RPC_URL = "https://sepolia.base.org"

[observability]
enabled = true
